name: Deploy

# push 到 main 时自动部署，也可在 Actions 页面手动触发
on:
  push:
    branches: [main]
  workflow_dispatch:

# 同一时间只跑一个部署，新推送取消进行中的旧部署
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建
        run: pnpm build

      - name: 配置 SSH
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          HOST: ${{ secrets.SERVER_HOST }}
          PORT: ${{ secrets.SERVER_PORT }}
          SSH_USER: ${{ secrets.SERVER_USER }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          {
            printf 'Host server\n'
            printf '  HostName %s\n' "$HOST"
            printf '  Port %s\n' "${PORT:-22}"
            printf '  User %s\n' "$SSH_USER"
            printf '  IdentityFile ~/.ssh/id_deploy\n'
            printf '  StrictHostKeyChecking accept-new\n'
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: 上传 dist 到服务器
        run: rsync -avz --delete dist/ server:/var/www/china-cities-marked/dist/
